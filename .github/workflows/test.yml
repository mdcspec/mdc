name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      # Runs the reference parser/CLI suite and the MCP server suite. The
      # conformance test drives the corpus through the real CLI, and (since
      # python3 is present on the runner) also exercises the language-agnostic
      # Python conformance runner against the JS implementation.
      - run: npm test
